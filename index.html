<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Todo-fetch</title>
</head>

<body>
    <div class="text-center top-heading">
        <h3>Todo Management</h3>
        <p>Add, Update and Delete todo here</p>
    </div>
    <div class="container">
        <div class="row mt-5">
            <div class="col-6 offset-3">
                <div class="card">
                    <div class="card-body">
                        <div class="card">
                            <div class="card-body">
                                <form id="form">
                                    <label for="todoControl"><b id="todoLabel">Add Todo </b></label>
                                    <input class="form-control mb-3" id="todoControl" type="text"
                                        placeholder="Enter Todo Name">

                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <button id="addBtn" class="btn btn-primary">Add</button>
                                            <button type="button" id="updateBtn"
                                                class="btn btn-primary d-none">Update</button>
                                        </div>

                                        <div>
                                            <button type="button" id="clearBtn" class="btn btn-danger">Clear</button>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="row" id="todoContainer">
                            <!-- <div class="col-12">
                                <div class="card mt-3">
                                    <div class="card-body p-2">
                                        <div class="d-flex justify-content-between">
                                            <h5>My first todo</h5>
                                            <div>
                                                <i role="button" class="fa-solid fa-pen-to-square p-2 text-primary"></i>
                                                <i role="button" class="fa-solid fa-trash ml-3 p-2 text-danger"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>

</html>
